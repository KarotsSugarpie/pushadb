name: Validate TiviMate Manager (Windows)

on:
  pull_request:
    paths:
      - 'src/PushADB/**'
      - '.github/workflows/tivimate-windows-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile PushADB Windows
        shell: pwsh
        run: dotnet build src/PushADB/PushADB.csproj -c Release -warnaserror
      - name: Create verified portable Windows ZIP
        shell: pwsh
        run: ./build-local.ps1
      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: PushADB-TiviMate-Windows-x64
          path: |
            PushADB-Windows-x64.zip
            PushADB-Windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14
