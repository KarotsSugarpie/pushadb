name: Build PushADB Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build and verify portable package
        shell: pwsh
        run: |
          ./build-local.ps1

      - name: Upload executable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PushADB-Windows-x64
          path: |
            PushADB-Windows-x64.zip
            PushADB-Windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30
