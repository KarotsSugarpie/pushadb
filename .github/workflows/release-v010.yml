name: Publish PushADB v0.1.0 Preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v010.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build verified Linux archive
        run: bash build-linux.sh
      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Windows cross-target portable executable
        id: windows
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore src/PushADB/PushADB.csproj -r win-x64 -p:EnableWindowsTargeting=true --configfile NuGet.Config
          dotnet publish src/PushADB/PushADB.csproj -c Release -r win-x64 --self-contained true --no-restore -p:EnableWindowsTargeting=true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o release-windows
          test -s release-windows/PushADB.exe
          curl -fLSs https://dl.google.com/android/repository/platform-tools-latest-windows.zip -o platform-tools.zip
          unzip -q platform-tools.zip -d release-windows
          cp README.md release-windows/README.md
          test -s release-windows/platform-tools/adb.exe
          (cd release-windows && zip -qr ../PushADB-Windows-x64.zip .)
          unzip -Z1 PushADB-Windows-x64.zip | grep -qx 'PushADB.exe'
          unzip -Z1 PushADB-Windows-x64.zip | grep -qx 'platform-tools/adb.exe'
          sha256sum PushADB-Windows-x64.zip > PushADB-Windows-x64.zip.sha256
      - name: Publish or update prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=v0.1.0-preview.1
          FILES=(PushADB-Linux-Preview.tar.gz PushADB-Linux-Preview.tar.gz.sha256)
          if [[ -s PushADB-Windows-x64.zip && -s PushADB-Windows-x64.zip.sha256 ]]; then
            FILES+=(PushADB-Windows-x64.zip PushADB-Windows-x64.zip.sha256)
          else
            echo "::warning::Windows cross-build unavailable; attach locally validated ZIP using gh release upload"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" --target "$GITHUB_SHA" \
              --title "PushADB v0.1.0 Preview | Windows & Linux" \
              --notes-file RELEASE_NOTES.md --prerelease
          fi
          gh release view "$TAG" --json url,assets --jq '{url:.url,assets:[.assets[].name]}'
